<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Code Debugger</title>
    <script src="alchemy_constants.js"></script>
    <style>
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: monospace;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            font-family: monospace;
        }

        button {
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        button:hover {
            background: #5dbf61;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .panel {
            background: #252525;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
        }

        h3 {
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            color: #aaa;
            font-size: 1em;
            text-transform: uppercase;
        }

        pre {
            background: #222;
            padding: 10px;
            border: 1px solid #333;
            white-space: pre-wrap;
            word-break: break-all;
            color: #bd93f9;
            max-height: 600px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <h1>Production Code Debugger</h1>
    <p>Paste a code, URL, or query string below to inspect the payload.</p>
    <div style="display:flex; gap:10px;">
        <textarea id="inputCode" placeholder="H4sIAAAAA..."></textarea>
    </div>
    <button onclick="debugCode()">Inspect Payload</button>

    <div class="grid">
        <div class="panel">
            <h3>Raw Compact JSON</h3>
            <pre id="output-raw">Waiting for input...</pre>
        </div>
        <div class="panel">
            <h3>Translated Verbose JSON</h3>
            <pre id="output-trans">Waiting for input...</pre>
        </div>
    </div>

    <div id="error-box" style="margin-top:20px; color:#ff5252; font-weight:bold;"></div>

    <script>
        async function debugCode() {
            const rawInput = document.getElementById('inputCode').value.trim();
            const outRaw = document.getElementById('output-raw');
            const outTrans = document.getElementById('output-trans');
            const errBox = document.getElementById('error-box');

            outRaw.textContent = "Processing...";
            outTrans.textContent = "Processing...";
            errBox.textContent = "";

            try {
                // 1. EXTRACT CODE
                let code = rawInput;

                // Helper: Decode HTML entities
                const decodeHTML = (str) => {
                    const doc = new DOMParser().parseFromString(str, "text/html");
                    return doc.documentElement.textContent;
                };

                // Remove surrounding URL parts if present
                if (code.includes('?') || code.includes('&')) {
                    // Try to parse as URL
                    try {
                        let search = code;
                        if (code.includes('?')) {
                            search = code.split('?')[1];
                        }
                        // Decode HTML entities to handle &amp;
                        search = decodeHTML(search);

                        const p = new URLSearchParams(search);
                        if (p.has('code')) {
                            code = p.get('code');
                        }
                    } catch (e) {
                        console.warn("Soft URL parse failed, using raw input");
                    }
                }

                // 2. URL-SAFE BASE64 CLEANUP
                // + -> -, / -> _ replacement used in app
                // App generates: .replace(/\+/g, '-').replace(/\//g, '_')
                // We need to REVERSE that: - -> +, _ -> /
                code = code.replace(/-/g, '+').replace(/_/g, '/');

                // 3. DECOMPRESS
                let jsonStr = "";
                try {
                    const binary = atob(code);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
                    const response = await new Response(stream);
                    jsonStr = await response.text();
                } catch (e) {
                    throw new Error("Decompression Failed. Invalid Base64 or Gzip data.");
                }

                // 4. PARSE RAW JSON
                const state = JSON.parse(jsonStr);
                outRaw.textContent = JSON.stringify(state, null, 2);

                // 5. TRANSLATE TO VERBOSE
                const translated = translateState(state);
                outTrans.textContent = JSON.stringify(translated, null, 2);

            } catch (e) {
                errBox.textContent = "Error: " + e.message;
                outRaw.textContent = "---";
                outTrans.textContent = "---";
                console.error(e);
            }
        }

        function translateState(state) {
            // Logic ported from alchemy_ui.js importStateToUI
            // Creates a DEEP COPY to return
            const k = CODE_KEYS; // From alchemy_constants.js
            const reg = ITEM_REGISTRY; // From alchemy_constants.js

            const resolve = (val) => {
                if (typeof val === 'number') {
                    // IDs are 1-based, Registry is 0-based
                    return reg[val - 1] || `Unknown_ID_${val}`;
                }
                return val;
            };

            // Detect Version
            const verboseState = { v: state[k.v] || state.v || 1 };

            // Check if Compact
            if (state[k.target] || state[k.settings]) {
                // --- TARGET ---
                if (state[k.target]) {
                    verboseState.target = {
                        item: resolve(state[k.target][k.item]),
                        rate: state[k.target][k.rate]
                    };
                }

                // --- SETTINGS ---
                if (state[k.settings]) {
                    const s = state[k.settings];
                    verboseState.settings = {
                        fuel: resolve(s[k.fuel]),
                        fert: resolve(s[k.fert]),
                        selfFeed: s[k.selfFeed] === 1,
                        selfFert: s[k.selfFert] === 1,
                        showMax: s[k.showMax] === 1
                    };
                }

                // --- UPGRADES ---
                if (state[k.upgrades]) {
                    verboseState.upgrades = state[k.upgrades]; // Array is same format
                }

                // --- LISTS ---
                if (state[k.lists]) {
                    const l = state[k.lists];
                    verboseState.lists = {
                        preferred: {},
                        recyclers: [],
                        externals: []
                    };

                    // Preferred
                    if (l[k.preferred]) {
                        for (let key in l[k.preferred]) {
                            // Key is Item ID (or Name), Value is RecipeID
                            // Need to parse key if it's an ID
                            // JSON object keys are ALWAYS strings. "75": "Recipe"
                            const itemKey = isNaN(key) ? key : resolve(parseInt(key));
                            verboseState.lists.preferred[itemKey] = l[k.preferred][key];
                        }
                    }

                    // Recyclers
                    if (l[k.recyclers]) {
                        verboseState.lists.recyclers = l[k.recyclers].map(resolve);
                    }

                    // Externals
                    if (l[k.externals]) {
                        verboseState.lists.externals = l[k.externals].map(packed => {
                            if (typeof packed !== 'string') return resolve(packed);
                            return packed.split('|').map(seg => {
                                const id = parseInt(seg);
                                if (!isNaN(id) && reg[id - 1]) return reg[id - 1];
                                return seg;
                            }).join('|');
                        });
                    }
                }
            } else {
                // Fallback: It's likely already verbose or old format
                return state;
            }

            return verboseState;
        }
    </script>
</body>

</html>
